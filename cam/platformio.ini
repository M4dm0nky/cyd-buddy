[env:cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
; esp-sr (Spracherkennung, kommt mit dem Arduino-Kern) meldet als einziges Modell seine Operatoren bei esp-dl an.
; esp-dl baut dann nur diese, und dem Gesichtsmodell fehlt Concat ("Do not support Concat"). Ohne esp-sr baut esp-dl alle.
custom_component_remove =
    espressif/esp-sr
build_flags =
    -I../src
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
